<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peaceful Corner</title>
    <link rel ="stylesheet" href="css/style.css">
</head>
<body>
    <!-- the background -->
    <!-- <video autoplay muted loop playsinline id="bg-video">
    <source src="elements/bgvid.mp4" type="video/mp4">
</video> -->

<div class="overlay"></div>
    <!-- The top part -->
     <header class="header">
    <div class="header-inner">

        <h1 id="site-title" class="site-title">
Peaceful Corner
        </h1>

        <!-- <button id="play-theme-btn" class="theme-btn">
            ▶ Play Theme
        </button> -->

    </div>
</header>



    <!-- center piano section -->
    <main class="main-container">

    <section class="piano-section">
    <div class="piano-container">

        <!-- White Keys (C5 - B6) -->
        <div class="white-keys">

            <button type="button" class="key white" data-note="C5" aria-label="C5">C5(a)</button>
            <button type="button" class="key white" data-note="D5" aria-label="D5">D5(s)</button>
            <button type="button" class="key white" data-note="E5" aria-label="E5">E5(d)</button>
            <button type="button" class="key white" data-note="F5" aria-label="F5">F5(f)</button>
            <button type="button" class="key white" data-note="G5" aria-label="G5">G5(g)</button>
            <button type="button" class="key white" data-note="A5" aria-label="A5">A5(h)</button>
            <button type="button" class="key white" data-note="B5" aria-label="B5">B5(j)</button>

            <button type="button" class="key white" data-note="C6" aria-label="C6">C6(k)</button>
            <button type="button" class="key white" data-note="D6" aria-label="D6">D6(l)</button>
            <button type="button" class="key white" data-note="E6" aria-label="E6">E6(;)</button>
            <button type="button" class="key white" data-note="F6" aria-label="F6">F6(')</button>
            <button type="button" class="key white" data-note="G6" aria-label="G6">G6(\)</button>
            <button type="button" class="key white" data-note="A6" aria-label="A6">A6(x)</button>
            <button type="button" class="key white" data-note="B6" aria-label="B6">B6(c)</button>

        </div>

        <!-- Black Keys -->
        <div class="black-keys">

            <button type="button" class="key black" data-note="C#5" aria-label="C#5">C#5<br>w</button>
            <button type="button" class="key black" data-note="D#5" aria-label="D#5">D#5<br>e</button>
            <button type="button" class="key black skip"></button>

            <button type="button" class="key black" data-note="F#5" aria-label="F#5">F#5<br>t</button>
            <button type="button" class="key black" data-note="G#5" aria-label="G#5">G#5<br>y</button>
            <button type="button" class="key black" data-note="A#5" aria-label="A#5">A#5<br>u</button>
            <button type="button" class="key black skip"></button>

            <button type="button" class="key black" data-note="C#6" aria-label="C#6">C#6<br>o</button>
            <button type="button" class="key black" data-note="D#6" aria-label="D#6">D#6<br>p</button>
            <button type="button" class="key black skip"></button>

            <button type="button" class="key black" data-note="F#6" aria-label="F#6">F#6<br>]</button>
            <button type="button" class="key black" data-note="G#6" aria-label="G#6">G#6<br>v</button>
            <button type="button" class="key black" data-note="A#6" aria-label="A#6">A#6<br>b</button>

        </div>

    </div>
</section>

</main>
